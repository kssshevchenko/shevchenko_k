<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Категорії</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f2e6ff;
        }

        h1 {
            margin-bottom: 20px;
            color: #4a3b6b;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card {
            background: #ffe6ff;
            padding: 12px;
            border-radius: 15px;
            text-align: center;
            transition: 0.2s;
            box-sizing: border-box;
        }

        .card:hover {
            background: #e6ffe6;
            transform: translateY(-3px);
        }

        .card img {
            width: 100%;
            max-width: 150px;
            margin: 10px auto 0;
            display: block;
            border-radius: 10px;
        }

        .card a {
            text-decoration: none;
            color: #6a4fa3;
            font-weight: bold;
            display: block;
            margin-top: 6px;
        }

        /* Адаптивність */
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<h1>Категорії</h1>

<div class="grid">
    {% for category in categories %}
        <div class="card">
            <a href="{% url 'category_products' category.slug %}">
                {% if category.image %}
                    <img src="{{ category.image.url }}" alt="{{ category.name }}">
                {% endif %}
                <div>{{ category.name }}</div>
            </a>
        </div>
    {% endfor %}
</div>

<a href="{% url 'products' %}" class="btn btn-primary">
    Подивитися всі товари
</a>

</body>
