<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Товари</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f2e6ff;
        }

        h1 {
            color: #6a4fa3;
            margin-bottom: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .product-card {
            background: #ffe6ff;
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            transition: 0.2s;
        }

        .product-card:hover {
            background: #e6ffe6;
            transform: translateY(-3px);
        }

        .product-card img {
            width: 100%;
            max-width: 200px;
            margin: 10px auto 0;
            display: block;
            border-radius: 10px;
        }

        .product-card a {
            display: block;
            text-decoration: none;
            color: #6a4fa3;
            font-weight: bold;
            margin-top: 8px;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            padding: 8px 12px;
            background: #e6ffe6;
            border-radius: 8px;
            text-decoration: none;
            color: #6a4fa3;
        }

        .back:hover {
            background: #ffe6ff;
        }

        @media (max-width: 768px) {
            .product-card { width: 100%; }
        }
    </style>
</head>
<body>

<h1>Товари</h1>

{% if products %}
    <div class="grid">
        {% for product in products %}
            <div class="product-card">
                <a href="{% url 'product_list' product.slug %}">
                    {% if product.image %}
                        <img src="{{ product.image.url }}" alt="{{ product.name }}">
                    {% endif %}
                    <div>{{ product.name }}</div>
                    <p>Ціна: {{ product.price }} грн</p>
                </a>
            </div>
        {% endfor %}
    </div>
{% else %}
    <p>Товарів у цій категорії поки немає.</p>
{% endif %}

<a href="/categories/" class="back">← Назад до категорій</a>

</body>
</html>
