{% load static %}

<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Кошик</title>

    <style>
        body {
            font-family: Arial;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
        }

        .cart-drawer {
            position: fixed;
            top: 0;
            right: -400px;
            width: 350px;
            height: 100%;
            background: white;
            padding: 20px;
            transition: right 0.3s ease;
            overflow-y: auto;
        }

        .cart-drawer.active {
            right: 0;
        }

        .overlay.active {
            display: block;
        }

        .close-btn {
            cursor: pointer;
            float: right;
            font-size: 20px;
        }

        .cart-item {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }

        .qty-controls {
            margin-top: 8px;
        }

        .qty-controls button {
            margin-right: 8px;
            padding: 3px 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: white;
            cursor: pointer;
        }

        .checkout-btn {
            display: block;
            margin-top: 20px;
            padding: 10px;
            background: black;
            color: white;
            text-align: center;
            text-decoration: none;
        }
    </style>
</head>

<body>

<button onclick="openCart()">Відкрити кошик</button>

<div class="overlay" id="overlay" onclick="closeCart()"></div>

<div class="cart-drawer" id="cartDrawer">

    <span class="close-btn" onclick="closeCart()">✖</span>

    <h2>Кошик</h2>

    <div id="cartContent"></div>

    <h3 id="totalPrice"></h3>

    <a href="{% url 'create_order' %}" class="checkout-btn">Оформити замовлення</a>

</div>

<!-- 🔥 ПІДКЛЮЧЕННЯ JS -->
<script src="{% static 'js/cart.js' %}"></script>

</body>
</html>
