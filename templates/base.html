<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Сайт{% endblock %}</title>

    {% load static %}

    <style>
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            z-index: 1000;
        }

        .overlay.active {
            display: block;
        }

        .cart-drawer {
            position: fixed;
            top: 0;
            right: -400px;
            width: 350px;
            height: 100%;
            background: white;
            padding: 20px;
            transition: right 0.3s ease;
            overflow-y: auto;
            z-index: 1001;
        }

        .cart-drawer.active {
            right: 0;
        }

        /* 🧠 стилі для сторінки товару */
        .product-image {
            text-align: center;
            margin-bottom: 15px;
        }

        .product-image img {
            max-width: 280px;
            max-height: 280px;
            width: auto;
            height: auto;
            display: block;
            margin: 0 auto;
            border-radius: 10px;
        }

        .checkout-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 16px;
            background: black;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<!-- 🔐 CSRF ТОКЕН ДЛЯ JS -->
<form style="display:none;">
    {% csrf_token %}
</form>

{% block content %}{% endblock %}

<!-- 🛒 КОШИК -->
<div class="overlay" id="overlay" onclick="closeCart()"></div>

<div class="cart-drawer" id="cartDrawer">

    <span onclick="closeCart()" style="cursor:pointer;float:right;">✖</span>

    <h2>Кошик</h2>

    <div id="cartContent"></div>

    <h3 id="totalPrice"></h3>

    <a href="{% url 'create_order' %}" class="checkout-btn">
        Оформити замовлення
    </a>

</div>

{% block scripts %}{% endblock %}

<script src="{% static 'js/cart.js' %}"></script>
<script src="{% static 'js/product.js' %}"></script>

</body>
</html>
