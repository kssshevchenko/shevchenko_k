<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Сайт{% endblock %}</title>

    {% load static %}

    <style>
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            z-index: 1000;
        }

        .overlay.active {
            display: block;
        }

        .cart-drawer {
            position: fixed;
            top: 0;
            right: -400px;
            width: 350px;
            height: 100%;
            background: white;
            padding: 20px;
            transition: right 0.3s ease;
            overflow-y: auto;
            z-index: 1001;
        }

        .cart-drawer.active {
            right: 0;
        }
    </style>
</head>

<body>

<!-- 🔥 ВСІ СТОРІНКИ БУДУТЬ ВТУТ -->
{% block content %}{% endblock %}

<!-- 🛒 ГЛОБАЛЬНИЙ КОШИК (ВАЖЛИВО!) -->
<div class="overlay" id="overlay" onclick="closeCart()"></div>

<div class="cart-drawer" id="cartDrawer">

    <span onclick="closeCart()" style="cursor:pointer;float:right;">✖</span>

    <h2>Кошик</h2>

    <div id="cartContent"></div>

    <h3 id="totalPrice"></h3>

    <a href="#" class="checkout-btn">Оформити замовлення</a>

</div>

<!-- JS -->
<script src="{% static 'js/cart.js' %}"></script>

{% block scripts %}{% endblock %}
<script src="{% static 'js/cart.js' %}"></script>
<script src="{% static 'js/product.js' %}"></script>
</body>
</html>
