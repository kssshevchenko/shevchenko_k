<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>{{ product.name }}</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2e6ff;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffe6ff;
            padding: 20px;
            border-radius: 12px;
        }

        h1 {
            color: #6a4fa3;
            margin-bottom: 15px;
        }

        .product-image {
            text-align: center;
            margin-bottom: 15px;
        }

        .product-image img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 10px;
        }

        .price {
            font-size: 20px;
            color: #333;
            margin-bottom: 10px;
        }

        .description {
            color: #555;
            margin-bottom: 15px;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            padding: 8px 12px;
            background: #e6ffe6;
            border-radius: 8px;
            text-decoration: none;
            color: #6a4fa3;
        }

        .back:hover {
            background: #ffe6ff;
        }
    </style>
</head>
<body>

<div class="container">

    <h1>{{ product.name }}</h1>

    <div class="product-image">
        {% if product.image %}
            <img src="{{ product.image.url }}" alt="{{ product.name }}">
        {% else %}
            <p>Немає зображення 🫠</p>
        {% endif %}
    </div>

    <div class="price">
        {{ product.price }} грн
    </div>

    {% if product.description %}
        <div class="description">
            {{ product.description }}
        </div>
    {% endif %}

    {% if product.category %}
        <p style="color:#777;">
            Категорія:
            <a href="{% url 'categories_details' product.category.slug %}">
                {{ product.category.name }}
            </a>
        </p>
    {% endif %}

    <a href="{% url 'products' %}" class="back">← Назад до всіх товарів</a>

</div>

</body>
</html>
