<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>{{ category.name }}</title>
    <style>
    body {
        font-family: Arial, sans-serif;
        padding: 20px;
        background-color: #f2e6ff;
    }

    h1 {
        color: #6a4fa3;
        margin-bottom: 15px;
    }

     .grid {
         display: grid;
         grid-template-columns: repeat(3, 1fr);
         gap: 20px;
        }

    .subcategories-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center; /* центр останнього ряду */
        gap: 12px; /* відстань між блоками */
        padding: 0;
        list-style: none;
    }

    .subcategory {
        background-color: #ffe6ff;
        width: calc(33.333% - 12px); /* 3 в ряд */
        padding: 8px;
        border-radius: 12px;
        text-align: center;
        transition: 0.2s;
        box-sizing: border-box;
    }

    .subcategory:hover {
        background-color: #e6ffe6;
    }

    .subcategory img {
        width: 100%;
        max-width: 200px;
        margin: 10px auto 0;
        display: block;
        border-radius: 10px;
    }

    .subcategory a {
        text-decoration: none;
        color: #6a4fa3;
        font-weight: bold;
        display: block;
        margin-top: 4px;
    }

    .empty {
        color: #777;
    }

    .back {
        display: inline-block;
        margin-top: 20px;
        padding: 8px 12px;
        background: #e6ffe6;
        border-radius: 8px;
        text-decoration: none;
        color: #6a4fa3;
    }

    .back:hover {
        background: #ffe6ff;
    }

    /* Адаптивність для мобільних екранів */
    @media (max-width: 768px) {
        .subcategory {
            width: calc(50% - 12px); /* 2 в ряд на планшетах */
        }
    }

    @media (max-width: 480px) {
        .subcategory {
            width: 100%; /* 1 в ряд на телефонах */
        }
    }

    </style>
</head>
<body>

    <h1>{{ category.name }}</h1>

    {% if category.image %}
        <img src="{{ category.image.url }}" width="200" style="display:block; margin-bottom:15px;">
    {% endif %}

    <h2>Підкатегорії:</h2>

    {% if subcategories %}
        <ul class="subcategories-container">
            {% for sub in subcategories %}
                <li class="subcategory">
                    {% if sub.image %}
                        <img src="{{ sub.image.url }}" alt="{{ sub.name }}">
                    {% endif %}
                    <a href="/categories/{{ sub.slug }}/">{{ sub.name }}</a>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p class="empty">Підкатегорій немає</p>
    {% endif %}

    <a href="/categories/" class="back">← Назад до всіх категорій</a>

</body>
</html>
