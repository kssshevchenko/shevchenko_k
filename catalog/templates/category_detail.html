<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>{{ category.name }}</title>
</head>
<body>

<h1>{{ category.name }}</h1>

{% if category.children.all %}
    <h3>Підкатегорії:</h3>
    <ul>
        {% for child in category.children.all %}
            <li>{{ child.name }}</li>
        {% endfor %}
    </ul>
{% else %}
    <p>Немає підкатегорій</p>
{% endif %}

</body>
</html>
