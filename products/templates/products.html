<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Товари</title>

    <style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f2e6ff;
        padding: 20px;
    }

    h1 {
        color: #6a4fa3;
        margin-bottom: 20px;
    }

    .products-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 15px;
    }

    .product-card {
        width: calc(33.333% - 15px); /* 3 в ряд */
        background-color: #ffe6ff;
        border-radius: 12px;
        padding: 10px;
        box-sizing: border-box;
        text-align: center;
        transition: 0.2s;
    }

    .product-card:hover {
        background-color: #e6ffe6;
        transform: scale(1.02);
    }

    .product-card img {
        max-width: 100%;
        height: 120px; /* невеликі картинки */
        object-fit: cover;
        border-radius: 8px;
        margin-bottom: 8px;
    }

    .product-name {
        font-weight: bold;
        color: #6a4fa3;
        margin-bottom: 5px;
    }

    .product-price {
        color: #333;
        font-size: 14px;
    }

    .empty {
        color: #777;
    }

    /* адаптивність */
    @media (max-width: 768px) {
        .product-card {
            width: calc(50% - 15px); /* 2 в ряд */
        }
    }

    @media (max-width: 480px) {
        .product-card {
            width: 100%; /* 1 в ряд */
        }
    }

    </style>
</head>
<body>

<h1>Товари</h1>

{% if products %}
    <div class="products-container">
        {% for product in products %}
            <div class="product-card">

                {% if product.image %}
                    <img src="{{ product.image.url }}" alt="{{ product.name }}">
                {% endif %}

                <div class="product-name">
                    {{ product.name }}
                </div>

                <div class="product-price">
                    {{ product.price }} грн
                </div>

            </div>
        {% endfor %}
    </div>
{% else %}
    <p class="empty">Товарів поки немає</p>
{% endif %}

</body>
</html>
